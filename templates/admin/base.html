{% extends 'admin/base.html' %}
{% load static %}

{% block extrahead %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'assets/css/admin_custom.css' %}">
{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        .sidebar {
            overflow: hidden;
        }

        .nav-sub {
            margin-left: 4%;
        }

        .nav-sub li a {
            width: 99.9% !important;
            height: 35px;
            padding: .35rem 1.2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-sub li a:hover {
            background-color: #3498db !important;
            color: #ffffff !important;
        }

        .sidebar-dark-navy {
            background-color: #001f3f !important;
            color: #ffffff !important;
        }

        .nav-sidebar .nav-link {
            color: #ffffff !important;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .nav-sidebar .nav-link.active, .nav-sidebar .nav-link:hover {
            background-color: #2E86C1 !important;
            transform: scale(1.05);
        }

        .content-wrapper {
            background-image: url("{% static 'assets/images/pexels-rostislav-5011647.jpg' %}") !important;
            background-size: cover;
            background-position: center;
            background-attachment: fixed !important;
        }

        body {
            background-size: cover;
        }



        .view-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            color: #3498db;
            transition: color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
            border-radius: 50%;
            overflow: hidden;
        }

        .view-button:hover {
            color: #2980b9;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            transform: scale(1.1);
        }

        .view-button i {
            transition: transform 0.3s ease;
        }

        .view-button:hover i {
            transform: rotate(20deg);
        }
    </style>
{% endblock %}

{% block extrajs %}
    <script>
        function viewProduct(productId) {
            var url = '/admin/orders/product/' + productId + '/change/';
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const viewButtons = document.querySelectorAll('.view-button');

            document.addEventListener('mousemove', function (event) {
                viewButtons.forEach(button => {
                    const rect = button.getBoundingClientRect();
                    const buttonCenterX = rect.left + rect.width / 2;
                    const buttonCenterY = rect.top + rect.height / 2;

                    const dx = event.clientX - buttonCenterX;
                    const dy = event.clientY - buttonCenterY;
                    const angle = Math.atan2(dy, dx);
                    const distance = Math.min(Math.sqrt(dx * dx + dy * dy), rect.width / 2);

                    button.style.transform = `translate(${distance * Math.cos(angle)}px, ${distance * Math.sin(angle)}px)`;
                });
            });

            document.addEventListener('mouseleave', function () {
                viewButtons.forEach(button => {
                    button.style.transform = 'translate(0, 0)';
                });
            });
        });
    </script>
{% endblock %}
